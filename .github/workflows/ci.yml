name: Publish Docs
env:
  GOOGLE_ANALYTICS_KEY: ${{ secrets.GOOGLE_ANALYTICS_KEY }}
  DRAFT_PASSWORD: ${{ secrets.DRAFT_PASSWORD }}
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - uses: actions/setup-python@v5
        with:
          python-version: 3.x
      
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          key: mkdocs-${{ hashFiles('.github/requirements.txt') }}
          path: ~/.cache/pip
      
      - name: Install dependencies
        run: |
          pip install -r .github/requirements.txt
          pip install pillow cairosvg
      
      - name: Debug folder structure
        run: |
          echo "=== Listing docs folder ==="
          ls -la docs/
          echo "=== Listing docs/projects folder ==="
          ls -la docs/projects/ || echo "projects folder not found"
          echo "=== Listing docs/writings folder ==="
          ls -la docs/writings/ || echo "writings folder not found"
      
      - name: Build and deploy
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdocs gh-deploy --force --verbose --clean
      
      - name: Purge Cloudflare Cache
        run: |
          curl -X POST "https://api.cloudflare.com/client/v4/zones/${{ secrets.CLOUDFLARE_ZONE_ID }}/purge_cache" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}'
        continue-on-error: true

      # New posts -> a Buttondown DRAFT + a one-click approval email to
      # test@theodore.net. Nothing reaches the list until you click Approve and
      # confirm (functions/api/newsletter-approve.js). No-ops if secrets are
      # unset, so this can't break a deploy.
      # NOTE: the only OTHER thing that can email the list is Buttondown's UI
      # RSS-to-email setting (Settings > Basic). Keep it paused/draft.
      - name: Newsletter (draft + approval email)
        env:
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
          NEWSLETTER_APPROVE_SECRET: ${{ secrets.NEWSLETTER_APPROVE_SECRET }}
        run: |
          if [ -n "$BUTTONDOWN_API_KEY" ] && [ -n "$NEWSLETTER_APPROVE_SECRET" ]; then
            python tools/newsletter.py --approve-to test@theodore.net \
              || echo "::warning::newsletter step failed (deploy unaffected)"
          else
            echo "newsletter secrets not set; skipping."
          fi
        continue-on-error: true