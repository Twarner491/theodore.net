{# store.js binds and enables this existing button instead of inserting a late icon. #}
{% if page and page.content and '/assets/js/store.js' in page.content %}
<button class="md-header__button md-icon store-cart-btn" type="button" aria-label="Open cart" disabled>
  <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" focusable="false"><path d="M19 6h-2c0-2.8-2.2-5-5-5S7 3.2 7 6H5c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2m-7-3c1.7 0 3 1.3 3 3H9c0-1.7 1.3-3 3-3m7 17H5V8h14zm-7-8c-1.7 0-3-1.3-3-3H7c0 2.8 2.2 5 5 5s5-2.2 5-5h-2c0 1.7-1.3 3-3 3"/></svg>
  <span class="store-cart-count">0</span>
</button>
<script>
(function () {
  // Restore the persisted badge before first paint. Store initialization still
  // validates product identities/limits; this is only the existing cart's count.
  var button = document.currentScript.previousElementSibling;
  var count = 0;
  try {
    var lines = JSON.parse(localStorage.getItem('store:cart:v3'));
    if (Array.isArray(lines)) lines.forEach(function (line) {
      if (!line || typeof line.id !== 'string' || !line.id || typeof line.build !== 'string') return;
      var quantity = Math.floor(Number(line.qty));
      if (Number.isFinite(quantity) && quantity > 0) count += Math.min(quantity, 99);
    });
  } catch (e) {}
  button.querySelector('.store-cart-count').textContent = String(count);
  button.classList.toggle('has-items', count > 0);
})();
</script>
{% endif %}
